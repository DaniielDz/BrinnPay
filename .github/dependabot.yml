version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "@prisma/*"
          - "prisma"

  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/loadtest"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      loadtest-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
