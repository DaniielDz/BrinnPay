name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm -r list

      - name: Validate package metadata
        run: node scripts/ci/validate-package-metadata.mjs

      - name: Validate required project files
        run: |
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f AGENTS.md
          test -f ROADMAP.md
          test -f .ai/SPEC.md
          echo "Required project files are present."

      - name: Validate OpenAPI contract
        run: pnpm lint:openapi

  ci:
    name: Lint, typecheck, test & build
    needs: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brinnpay
          POSTGRES_PASSWORD: brinnpay
          POSTGRES_DB: brinnpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brinnpay -d brinnpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      # Phase 17 D2(a)/AC10: coverage ratchet. The thresholds live next to the
      # measured baseline in `apps/api/jest.config.js` and
      # `apps/web/vitest.config.ts` (ADR-0034); a regression below either one
      # fails this step. Explicit and separate from the unit-test step so a
      # coverage-gate failure is legible on its own.
      - name: Coverage thresholds (phase 17 ratchet)
        run: pnpm test:coverage

      - name: Apply Prisma migrations
        run: pnpm --filter @brinnpay/api prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://brinnpay:brinnpay@localhost:5432/brinnpay?schema=public

      - name: Integration/E2E tests
        run: pnpm -r run test:e2e
        env:
          DATABASE_URL: postgresql://brinnpay:brinnpay@localhost:5432/brinnpay?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm -r run build

      # Phase 17 D1(a)/D7(a): the bounded browser critical-flow set (§12.5) on
      # every pull request, over the built apps and the service containers this
      # job already provides. The browser download is cached on the lockfile
      # hash; an install failure fails the job (rule 5 — never a silent no-op).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm --filter @brinnpay/web exec playwright install --with-deps chromium

      - name: Browser end-to-end tests (phase 17 §12.5)
        run: pnpm test:browser
        env:
          DATABASE_URL: postgresql://brinnpay:brinnpay@localhost:5432/brinnpay?schema=public
          REDIS_URL: redis://localhost:6379
