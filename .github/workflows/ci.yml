name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm -r list

      - name: Validate package metadata
        run: node scripts/ci/validate-package-metadata.mjs

      - name: Validate required project files
        run: |
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f AGENTS.md
          test -f ROADMAP.md
          test -f .ai/SPEC.md
          echo "Required project files are present."

      - name: Validate OpenAPI contract
        run: pnpm lint:openapi

  ci:
    name: Lint, typecheck, test & build
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      - name: Integration/E2E tests
        run: pnpm -r run test:e2e

      - name: Build
        run: pnpm -r run build
