                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/webhook-endpoints:
    get:
      tags: [webhooks]
      operationId: webhooks.listEndpoints
      summary: List webhook endpoints of a project
      description: |
        Lists the registered webhook endpoints of a project environment with
        cursor pagination. `signing_secret` is never included. Creating or
        enabling an endpoint also delivers the events it missed while it was
        disabled, because the reconciliation pass recomputes the fan-out of
        retained events within a bounded window: the pass scans events from
        `now - WEBHOOK_RECONCILIATION_HORIZON_MS` (1 hour by default) up to
        30 seconds old, and the horizon is rejected at boot if it is not longer
        than that minimum age. Events older than the horizon stay listable and
        replayable through the replay operation, but the safety net does not
        backfill them on its own.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated webhook endpoint list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [webhooks]
      operationId: webhooks.createEndpoint
      summary: Register a webhook endpoint
      description: |
        Registers a destination URL with an event subscription for a project
        environment. The signing secret is returned only once, at creation; it is
        used to verify HMAC-SHA256 signatures of outbound deliveries.

        `event_types` is validated against the closed catalog
        (`payment.created`, `payment.succeeded`, `payment.failed`,
        `refund.created`); it must be a non-empty subset of it, and an unknown
        type is a 400 `VALIDATION_ERROR`, as is a missing or empty `event_types`.
        `url` must be an absolute `http`/`https` URL that satisfies the
        destination policy; malformed and non-HTTP URLs are a 400
        `VALIDATION_ERROR`. With API-key authentication the body's `environment`
        must match the key's environment; an explicit conflict is a 422
        `BUSINESS_RULE_VIOLATION` (an endpoint of the key's project in the other
        environment, addressed by id, is instead a 404 that discloses nothing).
        Duplicate URLs are allowed: there is no uniqueness constraint on
        `(project, environment, url)`.

        The returned `signing_secret` is unrecoverable afterwards (no rotation
        operation in this version); recovery is delete and recreate.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/WebhookEndpointCreateBody"
      responses:
        "201":
          description: Webhook endpoint created. The signing secret is returned only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/webhook-endpoints/{endpoint_id}:
    get:
      tags: [webhooks]
      operationId: webhooks.retrieveEndpoint
      summary: Retrieve a webhook endpoint
      description: Returns a registered webhook endpoint. The signing secret is never returned.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: Webhook endpoint details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [webhooks]
      operationId: webhooks.updateEndpoint
      summary: Update a webhook endpoint
      description: |
        Updates the URL, event subscription, or enabled state of a webhook
        endpoint. Omitted fields are unchanged; an empty body is a 400. The
        signing secret is never rotated or returned.

        Setting `enabled` to `false` stops **new** deliveries from being created;
        deliveries already queued for the endpoint still run (D11). A disabled
        endpoint also no longer accepts a replay (422).

        The same validation rules as `webhooks.createEndpoint` apply to `url` and
        `event_types`, and they are reported the same way: a 400
        `VALIDATION_ERROR`. The update body carries no `environment` — it is
        derived from the addressed endpoint and cannot change — so the declared
        422 is reserved and is not produced in this version.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        $ref: "#/components/requestBodies/WebhookEndpointUpdateBody"
      responses:
        "200":
          description: Updated webhook endpoint.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [webhooks]
      operationId: webhooks.deleteEndpoint
      summary: Delete a webhook endpoint
      description: |
        Deletes a webhook endpoint, stopping deliveries to it. Its delivery rows
        are removed with it; a delivery job still queued for a deleted endpoint
        is a silent no-op. Requires an administrative role (owner or admin) with
        a session, or an API key scoped to the endpoint's project and
        environment.

        The `422` response below is reserved for contract symmetry and is not
        produced in this version: deletion has no business-rule precondition.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "204":
          description: Webhook endpoint deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/webhook-endpoints/{endpoint_id}/deliveries:
    get:
      tags: [webhooks]
      operationId: webhooks.listDeliveries
      summary: List deliveries of a webhook endpoint
      description: |
        Lists the deliveries of events to a webhook endpoint with cursor
        pagination. One row is one `(event, endpoint)` aggregate with an
        `attempts` counter and the last attempt's outcome, not one row per
        attempt (D4). Delivery is at-least-once and unordered: a destination that
        times out after processing receives the same envelope again and must
        deduplicate by envelope `id` (which equals `BrinnPay-Event-Id`).

        Each attempt is an HTTP `POST` of the stored envelope with the headers
        `BrinnPay-Signature`, `BrinnPay-Event-Id`, `BrinnPay-Event-Type`,
        `BrinnPay-Delivery-Id`, `BrinnPay-Attempt`, and
        `User-Agent: BrinnPay-Webhooks/1.0`. The signature value is
        `t=<unix-seconds>,v1=<lowercase-hex HMAC-SHA256>` and the signed message is
        `${t}.${rawBody}`, where `t` is generated per attempt and `rawBody` is the
        exact bytes transmitted, so a destination must verify against the raw
        body rather than a re-serialization of the parsed JSON (D7).

        A retryable failure is retried up to five attempts total with exponential
        backoff and full jitter (approximately 0 s, 30 s, 2 min, 10 min, 1 h,
        capped). A parseable `Retry-After` header is honored, clamped to the same
        cap; seconds and HTTP-date are accepted, anything else is ignored. Network
        errors and timeouts, and the statuses 408, 425, 429 and 5xx, are
        retryable; any other 4xx and every 3xx are terminal `failed` and are never
        retried. Redirects are never followed and response bodies are never read
        or stored, so `last_error` carries only a bounded, sanitized summary
        (D5/D6).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/DeliveryStatus"
      responses:
        "200":
          description: Paginated delivery list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/webhook-endpoints/{endpoint_id}/events/{event_id}/replay:
    post:
      tags: [webhooks]
      operationId: webhooks.replayEvent
      summary: Replay a webhook event to an endpoint
      description: |
        Re-creates a delivery of a retained event to a webhook endpoint as a new
        delivery with the original envelope; the event is not modified and the
        attempt is repeated for the same `(event, endpoint)` pair, so replaying
        twice produces two deliveries (`is_replay` is `true`).

        The event must belong to the same project **and** environment as the
        endpoint; a foreign, cross-environment, or retention-expired event is a
        404 and reveals nothing about either resource. An endpoint that is
        disabled or not subscribed to the event's type is a 422.

        Replay is intentionally repeatable: the partial unique index that
        guarantees at most one fan-out delivery per `(event, endpoint)` excludes
        replays. Requires an administrative role (owner or admin) with a session,
        or an API key scoped to the endpoint's project and environment.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "202":
          description: Replay accepted and queued for delivery.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/webhook-events:
    get:
      tags: [webhooks]
      operationId: webhooks.listEvents
      summary: List webhook events of a project
      description: |
        Lists the outbound events emitted in a project environment with cursor
        pagination. Each row is the stored outbound envelope
        (`id`, `type`, `environment`, `project_id`, `data`, `created_at`). Events
        are retained for a configurable window (default 30 days); an expired
        event is removed by the cleanup pass, absent here, and 404 on replay.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventType"
      responses:
        "200":
          description: Paginated webhook event list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/logs/requests:
    get:
      tags: [logs]
      operationId: logs.listRequestLogs
      summary: List request logs of a project
      description: |
        Lists the structured request/response records of a project with cursor
        pagination (Phase 11). Request logs are API-wide records; this project
        view returns only records scoped to the project. Non-project requests
        (e.g. `/auth/*`) exist in the log store but are not exposed by this
        project-scoped endpoint.

        Authority is **session-only**: an API key (`sk_test_...`) never reads
        request logs and is rejected with `401`. Members of the project
        organization holding the `logs.read` capability (every role) receive
        `200`; an unknown or foreign `project_id` is `404`, so project existence
        is never disclosed.

        Ordering is **ascending by UUIDv7**, matching every other list. Pages are
        stable and non-overlapping while filtering; `limit` defaults to `20` and
        may not exceed `100`.

        Records contain metadata only (method, path without query string, status,
        duration, timestamp and scope ids) — never bodies, headers, query strings
        or secrets. Records are written after the response completes, so one may
        become visible slightly after the caller received its response. Rows are
        retained for a configurable window (default **30 days**) and then removed
        by the retention job; expired records are simply gone.

        `environment` is an **optional equality filter**: absent it returns
        records of both environments plus records with no environment; present it
        returns only records whose environment matches (records with a null
        environment are excluded). `request_id` is an optional exact lookup within
        this project: no match returns an empty page, never a `404`.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RequestLogEnvironment"
        - $ref: "#/components/parameters/RequestIdFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated request log list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestLogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}/logs/audit:
    get:
      tags: [logs]
      operationId: logs.listAuditLogs
      summary: List audit logs of an organization
      description: |
        Lists the immutable audit log entries of an organization with cursor
        pagination (Phase 12). Entries answer *who did what, to which
        resource, when* for security-relevant and business-relevant events.

        Authority is **session-only**: an API key (`sk_test_...`/`sk_live_...`)
        never reads audit logs and is rejected with `401`. Members of the
        addressed organization holding the `logs.read` capability (every role:
        owner, admin, member, viewer) receive `200`; an unknown or foreign
        `organization_id` is `404`, so organization existence is never
        disclosed, and a member without the capability is `403`.

        Scope is **organization-wide**: the list covers every project of the
        organization and both environments (`test` and `live`); entries carry
        nullable `project_id`/`environment` columns so project-scoped actions
        can be attributed. Ordering is **ascending by UUIDv7**, matching every
        other list; pages are stable and non-overlapping. `limit` defaults to
        `20` and may not exceed `100`. There are no filters beyond pagination —
        no action, resource or time-range selection.

        Entries are **append-only**: they are never updated or deleted through
        this or any other operation (phase 1 §8), and are removed only when
        their organization is deleted. `action` is one of the catalog values
        documented on the schema; `data` holds only bounded, allowlisted
        scalars (ids, roles, monetary amounts, the optional `request_id`
        correlation key) — never secrets, emails, headers, bodies or free text.

        Reading this list produces no audit entry of its own.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated audit log list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogEntryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_test_... | sk_live_...
      description: |
        API-key authentication for programmatic access (ADR-0006). The key is
        sent as `Authorization: Bearer sk_test_...` (TEST) or
        `Authorization: Bearer sk_live_...` (LIVE). A key is scoped to exactly
        one project environment and can only act within that scope; it never
        carries organization-management authority. Keys are shown once at
        creation, stored hashed, and never logged.
    SessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session authentication with a short-lived JWT access token for
        dashboard/user endpoints (phase 1 §7.3, §11.5). Tokens are obtained
        through `/auth/login` and refreshed through `/auth/refresh` (refresh
        token travels only as an `HttpOnly` cookie). Session requests are scoped
        to the authenticated user's organization memberships and subject to RBAC.

  headers:
    X-Request-Id:
      description: |
        Request ID assigned to the request at ingress (phase 1 §7.7). Every
        response carries it; it is propagated through logs, error responses, and
        outbound webhook delivery records.
      schema:
        type: string
        example: req_0192f2a0-0000-7000-8000-000000000001
    RefreshTokenCookie:
      description: |
        Sets (or rotates) the refresh session token as an `HttpOnly` cookie
        (phase 1 §11.5; D2/D10). Never readable by browser JavaScript. Name
        `brinnpay_refresh`, `Path=/api/v1/auth`, `HttpOnly` always, `Secure` in
        secure/production environments, `SameSite=Lax`. Each refresh session
        lives for 30 days (D10); rotation on refresh opens a new window. The
        refresh token is never returned in a JSON body.
      schema:
        type: string
        example: brinnpay_refresh=opaque_httpOnly_value; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
    RefreshTokenCookieCleared:
      description: |
        Clears the refresh session cookie by setting an expired value (phase 1
        §11.5). On logout the cookie is always cleared, whether or not a valid
        session was present (D9).
      schema:
        type: string
        example: brinnpay_refresh=; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=0
    RateLimit-Limit:
      description: |
        The limit of the budget reported on this response (phase 13 §4.4). The
        reported budget is the one **closest to exhaustion** of the scopes that
        apply to the operation, so a caller is never told there is headroom on a
        request that is about to be rejected. Values are per-class configuration,
        not per-operation ones.
      schema:
        type: integer
        minimum: 1
        example: 120
    RateLimit-Remaining:
      description: |
        Units left in the current window of the reported budget. `0` means the
        next request of the same scope and class is rejected with `429`. Present
        on allowed **and** rejected responses.
      schema:
        type: integer
        minimum: 0
        example: 119
    RateLimit-Reset:
      description: |
        Whole seconds until the current window of the reported budget resets. The
        window is anchored at the first counted request of that window, not at a
        calendar boundary, and the value comes from the same atomic read as
        `RateLimit-Remaining` — never an estimate. Always at least `1`.
      schema:
        type: integer
        minimum: 1
        example: 60
    Retry-After:
      description: |
        Present on `429` only: whole seconds until the reported budget's window
        resets. It is derived from the same atomic read as `RateLimit-Reset`, so
        a client can wait exactly this long and retry, and it is never zero or
        negative.
      schema:
        type: integer
        minimum: 1
        example: 47

  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: Organization UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-00000000000a
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Project UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-00000000000b
    PaymentId:
      name: payment_id
      in: path
      required: true
      description: Payment UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000001
    CustomerId:
      name: customer_id
      in: path
      required: true
      description: Customer UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000002
    RefundId:
      name: refund_id
      in: path
      required: true
      description: Refund UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000003
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      description: API key entity UUIDv7 ID, treated as an opaque string (ADR-0001). This is not the credential material.
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000004
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      description: Webhook endpoint UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000005
    EventId:
      name: event_id
      in: path
      required: true
      description: Webhook event UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000006
    InvitationId:
      name: invitation_id
      in: path
      required: true
      description: Invitation UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000007
    UserId:
      name: user_id
      in: path
      required: true
      description: User UUIDv7 ID, treated as an opaque string (ADR-0001).
      schema:
        type: string
        format: uuid
        example: 0192f2a0-0000-7000-8000-000000000008
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results per page (cursor pagination, phase 1 §7.5).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor returned as `next_cursor` in the previous page. The server
        derives cursors from the time-ordered entity IDs (UUIDv7, ADR-0001).
        Clients must not decode cursors or reuse them across unrelated lists.
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      description: |
        Free-text search (Phase 6, D3): case-insensitive substring match across
        the customer `email` and `name` fields, composed with the environment
        filter and cursor pagination. An empty or whitespace-only term is
        treated as absent. No relevance ranking in the MVP.
      schema:
        type: string
        maxLength: 200
    Environment:
      name: environment
      in: query
      required: false
      description: |
        Project environment filter (`test` or `live`). With session
        authentication this selects the environment to operate on. With API-key
        authentication the environment is derived from the key and must match.
      schema:
        $ref: "#/components/schemas/Environment"
    RequestLogEnvironment:
      name: environment
      in: query
      required: false
      description: |
        Optional equality filter over the recorded `environment` of a request
        log (Phase 11, D1). Absent → every record of the project, including
        records captured without an environment. Present → only records whose
        environment equals the value; records with a null environment are
        excluded. An invalid value is a `400 VALIDATION_ERROR`. Unlike the
        environment parameter of the data endpoints, a *missing* value is never
        an error here: the contract states no requiredness for this operation.
      schema:
        $ref: "#/components/schemas/Environment"
    RequestIdFilter:
      name: request_id
      in: query
      required: false
      description: |
        Optional exact lookup of one request log within the addressed project
        (Phase 11, D8), used to find the record behind a request ID reported
        from an error envelope or an `X-Request-Id` response header
        (`docs/api-conventions.md` §7). Must match the server-assigned scheme
        `req_` + 32 lowercase hex characters; a malformed value is a `400
        VALIDATION_ERROR`. A well-formed ID with no match in this project
        returns an empty page (`data: []`, `has_more: false`) — never a `404`
        — and cannot address another project's records.
      schema:
        type: string
        pattern: '^req_[0-9a-f]{32}$'
        example: req_0192f2a0000070008000000000000001
    EventType:
      name: type
      in: query
      required: false
      description: |
        Optional event-type filter for `webhooks.listEvents` (D15). Must be a
        member of the closed webhook catalog; an unknown type is a 400.
      schema:
        type: string
        enum:
          [
            payment.created,
            payment.succeeded,
            payment.failed,
            refund.created,
          ]
        example: payment.succeeded
    DeliveryStatus:
      name: status
      in: query
      required: false
      description: |
        Optional status filter for `webhooks.listDeliveries` (D15): only
        `pending` (queued or retrying), `delivered`, or `failed` (attempts
        exhausted or a non-retryable outcome). A value outside the enum is a 400
        `VALIDATION_ERROR`, not an empty page.
      schema:
        type: string
        enum: [pending, delivered, failed]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Idempotency key for critical mutations (phase 1 §7.4, ADR-0004). Key
        scope = (project, operation_scope, key): replaying the same key for the
        same operation within the 24-hour retention window returns the original
        stored response without re-executing the operation; the same key against
        a different operation scope is an independent operation; reuse after
        expiry is treated as a new operation. Live consumers: `payments.create`.
        Next planned consumer: `refunds.create`. Only committed successful
        responses are replayed, and a replayed response carries the current
        request's `X-Request-Id`, never the stored one. Values are trimmed and
        must be 1-255 characters; an invalid value is a 400.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  requestBodies:
    RegisterBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterRequest"
    LoginBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
    OrganizationCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationCreate"
    OrganizationUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationUpdate"
    OrganizationMemberUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationMemberUpdate"
    InvitationCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitationCreate"
    ProjectCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectCreate"
    ProjectUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectUpdate"
    ApiKeyCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiKeyCreate"
    CustomerCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerCreate"
    CustomerUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerUpdate"
    PaymentCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentCreate"
    RefundCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefundCreate"
    WebhookEndpointCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookEndpointCreate"
    WebhookEndpointUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookEndpointUpdate"

  responses:
    BadRequest:
      description: Validation failed — the request is malformed or a field violates validation rules.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Authentication is missing or invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated principal is not authorized for this operation (RBAC or tenant isolation).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with the current state of the resource (e.g., duplicate email, duplicate active key).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BusinessRuleViolation:
      description: |
        A domain/business rule was violated (e.g., refunding an already fully
        refunded payment, `PAYMENT_ALREADY_REFUNDED`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: |
        The request exceeded an applicable rate limit (phase 13). Every operation
        is rate limited; see the rate-limiting policy in `info.description` and
        `docs/api-conventions.md` §10.

        A `429` is **retryable**, never an authorization or data problem: the
        handler did not run, nothing was changed, and the response says when to
        try again through `Retry-After`. Requests rejected earlier in the request
        lifecycle (validation, authentication, authorization, a business rule) are
        counted too, so a caller may see a `429` where it previously saw a `4xx`
        while its budget was being consumed.

        The response repeats `X-Request-Id` and reports the budget of the bucket
        that was exhausted through `RateLimit-Limit`, `RateLimit-Remaining` and
        `RateLimit-Reset`. `error.details` carries budget numbers only
        (`limit`, `remaining`, `window_seconds`) and never an identity, a scope or
        an internal name.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Environment:
      type: string
      enum: [test, live]
      description: |
        Project API environment (phase 1 §5.2). Both environments are simulated;
        no real money is processed in either. TEST and LIVE data is never mixed.

    Role:
      type: string
      enum: [owner, admin, member, viewer]
      description: Organization membership role (phase 1 §4, §10).

    MoneyAmount:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      description: |
        Monetary amount as a decimal string in the currency's minor-unit scale
        (ADR-0002). For USD two decimal places are supported, e.g. `"10.00"`.
        Amounts are strictly positive (zero and negative values are rejected
        as a 400 `VALIDATION_ERROR`).

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Consistent JSON error envelope (phase 1 §7.6). `code` is a stable
        machine-readable string (general codes such as `VALIDATION_ERROR`,
        `UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`, `RATE_LIMITED`,
        plus business-specific codes such as `PAYMENT_ALREADY_REFUNDED`).
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: PAYMENT_ALREADY_REFUNDED
            message:
              type: string
              description: Human-readable error message. Never leaks internals, stack traces, or secrets.
              example: This payment has already been fully refunded.
            request_id:
              type: string
              description: Request ID assigned at ingress (phase 1 §7.7).
              example: req_0192f2a0-0000-7000-8000-000000000001
            details:
              type: object
              additionalProperties: true
              description: Optional structured information (e.g., validation field errors).

    User:
      type: object
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 ID, opaque to clients (ADR-0001).
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
          description: Optional display name.
        created_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.
        updated_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Password (D6): 8–128 characters, no composition rules (NIST-style).
            Stored only as a hash (Argon2id, the required/default algorithm —
            ADR-0007). Never logged or returned.
        name:
          type: string
          description: Optional display name.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: The account password. Never logged.

    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      description: |
        Session created by register/login. The access token is short-lived and
        held in memory by the web app. The refresh token is **not** returned in
        JSON; it is set as an `HttpOnly` cookie on the response (phase 1 §11.5).
      properties:
        access_token:
          type: string
          description: JWT access token for session authentication.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: "#/components/schemas/User"

    AccessTokenResponse:
      type: object
      description: |
        Newly issued short-lived access token. Any rotated refresh token is
        delivered only via the `HttpOnly` cookie, never in this body
        (phase 1 §11.5).
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Newly issued JWT access token.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.

    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 ID, opaque to clients (ADR-0001).
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    OrganizationMember:
      type: object
      required: [id, organization_id, user_id, role, created_at, updated_at, user]
      description: |
        Membership entry (phase 4 §4.2). Carries the member's identity via the
        `user` object. `user_id` is the target's account; `role` is the member's
        role in this organization.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.
        updated_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp; advances on role changes.
        user:
          type: object
          required: [id, email, name]
          description: The member's identity (subset of `User`, phase 3).
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            name:
              type: [string, "null"]
              description: Optional display name.

    OrganizationMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    Invitation:
      type: object
      required: [id, organization_id, email, role, status, created_at, updated_at, accepted_at, canceled_at]
      description: |
        Email invitation to join an organization (phase 4 §4.2). Lifecycle:
        `pending` → `accepted` (the invitee accepted and a membership was
        created) or `canceled` (owner/admin revoked it). `accepted_at` and
        `canceled_at` are `null` while `status` is `pending`.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Normalized (trimmed, lower-cased) invitation target.
        role:
          $ref: "#/components/schemas/Role"
          description: Role conferred upon acceptance.
        status:
          type: string
          enum: [pending, accepted, canceled]
        created_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.
        updated_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp; advances on acceptance/cancellation.
        accepted_at:
          type: [string, "null"]
          format: date-time
          description: Set when the invitation is accepted.
        canceled_at:
          type: [string, "null"]
          format: date-time
          description: Set when the invitation is canceled.

    InvitationCreate:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"

    Project:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
          description: |
            The API environments available for the project. A project supports
            both `test` and `live` by default; each environment-scoped resource
            belongs to exactly one environment and TEST/LIVE data is never mixed
            (phase 1 §5.2).

    ProjectCreate:
      type: object
      required: [organization_id, name]
      properties:
        organization_id:
          type: string
          format: uuid
          description: The organization that owns the project.
        name:
          type: string
          minLength: 1
      description: |
        Creates a project. Both API environments (`test` and `live`) are
        available by default; the MVP has no option to disable either.

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    ApiKey:
      type: object
      required: [id, project_id, environment, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: API key entity ID. Not the credential material.
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: Set when the key is revoked; revoked keys are rejected.

    ApiKeyCreated:
      type: object
      required: [id, project_id, environment, key, created_at]
      description: |
        API key creation response. The plaintext `key` (`sk_test_...` /
        `sk_live_...`) is returned exactly once and cannot be recovered later
        (ADR-0006). Only a hash is stored; the key is never logged.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        key:
          type: string
          description: Plaintext key material, returned only at creation.
          example: sk_test_0192f2a0-0000-7000-8000-00000000000a
        created_at:
          type: string
          format: date-time

    ApiKeyCreate:
      type: object
      required: [environment]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"

    Customer:
      type: object
      required: [id, project_id, environment, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        email:
          type: string
          format: email
          description: |
            Normalized (trimmed + lowercased) customer email. Not unique
            (D1): multiple customers may share an email within a
            project/environment.
        name:
          type: [string, "null"]
          description: Optional customer name; null when never provided (D7).
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Developer-defined flat string-map metadata (D4): string keys
            ≤ 40 chars, string values ≤ 500 chars, ≤ 50 entries. Always an
            object in responses — absent at creation → `{}`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      required: [environment, email]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
          description: |
            The project environment the customer belongs to. With API-key
            authentication it must match the key's environment (mismatch →
            422 `BUSINESS_RULE_VIOLATION`); with session authentication it is
            required (missing → 400 `VALIDATION_ERROR`).
        email:
          type: string
          format: email
          description: |
            Customer email, trimmed and lowercased before storage. Not unique
            (D1).
        name:
          type: string
          description: Optional non-empty customer name (≤ 200 chars, trimmed).
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Optional flat string-map metadata (D4): string keys ≤ 40 chars,
            string values ≤ 500 chars, ≤ 50 entries; absent → `{}`.

    CustomerUpdate:
      type: object
      description: |
        Partial update — only provided fields change. The environment of a
        customer is immutable after creation; `name` cannot be cleared to
        null (D7); `metadata` replaces the whole map (D4).
      properties:
        email:
          type: string
          format: email
          description: New email (trimmed + lowercased before storage).
        name:
          type: string
          description: New non-empty name (≤ 200 chars, trimmed); not null-clearing (D7).
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Replacement flat string-map metadata (D4): string keys ≤ 40
            chars, string values ≤ 500 chars, ≤ 50 entries. Replaces the
            current map wholesale — no merging.

    Payment:
      type: object
      required:
        - id
        - project_id
        - environment
        - customer_id
        - amount
        - currency
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        customer_id:
          type: string
          format: uuid
          description: The customer this payment belongs to.
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          enum: [usd]
          description: USD only in the MVP (ADR-0003); the field is kept for forward compatibility.
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
          description: |
            Payment lifecycle status. The simulation advances payments
            deterministically from `created_at`: `pending → processing` then
            `processing → succeeded` (the default-success simulation). Terminal
            states are absorbing; a payment never leaves `succeeded`/`failed`.
            The `failed` status is defined (and its transition legal) with no
            public trigger in this phase — the sandbox controls of a later
            phase enable it.
        failure_code:
          type: [string, "null"]
          description: |
            Machine-readable failure reason, `null` unless `status` is
            `failed`. The failure-code catalog is defined by the sandbox
            controls of a later phase — always `null` in this phase.
        description:
          type: [string, "null"]
          description: Optional developer-provided description.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentCreate:
      type: object
      required: [environment, customer_id, amount, currency]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
          description: |
            The project environment to create the payment in. With API-key
            authentication it must match the key's environment.
        customer_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          enum: [usd]
        description:
          type: string

    Refund:
      type: object
      required:
        - id
        - payment_id
        - project_id
        - environment
        - amount
        - currency
        - status
        - reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          enum: [usd]
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
          description: Phase 9 creates succeeded refunds synchronously; other enumerated values are reserved and are not emitted by Phase 9.
        reason:
          type: [string, "null"]
          maxLength: 255
          description: Trimmed developer-provided reason; null when omitted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RefundCreate:
      type: object
      description: |
        Omitting `amount` refunds the full remaining balance, including after
        partial refunds. An explicit positive amount may not exceed the
        remaining balance. Refunds succeed synchronously.
      properties:
        amount:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          type: string
          enum: [usd]
          description: Defaults to `usd` when omitted (USD-only MVP, ADR-0003).
        reason:
          type: string
          description: Optional reason; trimmed before validation, must be nonempty and at most 255 characters after trimming. Omit rather than pass null.

    WebhookEndpoint:
      type: object
      required:
        [
          id,
          project_id,
          environment,
          url,
          event_types,
          enabled,
          created_at,
          updated_at,
        ]
      description: |
        A developer-registered destination URL with an event subscription. The
        signing secret is never returned by the API.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
          description: Subscribed event types from the closed webhook catalog.
        enabled:
          type: boolean
          description: |
            When `false`, no new delivery is created for this endpoint. A
            delivery already queued still runs (D11).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEndpointCreated:
      type: object
      required:
        [
          id,
          project_id,
          environment,
          url,
          event_types,
          enabled,
          signing_secret,
          created_at,
          updated_at,
        ]
      description: |
        Webhook endpoint creation response. The `signing_secret` is returned
        exactly once and is used to verify HMAC-SHA256 signatures of outbound
        deliveries. The secret is never logged or returned again.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
        signing_secret:
          type: string
          description: |
            Endpoint signing secret, returned only at creation. It is stored
            encrypted (AES-256-GCM) and is **not** recoverable through the API:
            there is no rotation or reveal operation, so it must be copied at
            creation time. Deleting and recreating the endpoint is the only way
            to obtain a new secret (D8).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEventType:
      type: string
      description: |
        A member of the closed webhook event catalog. The catalog is owned by
        the emitting domain modules: an unknown type is rejected with a 400
        `VALIDATION_ERROR` rather than stored, because a stored type that is
        never emitted would create an endpoint that can never fire (D1).
      enum:
        [
          payment.created,
          payment.succeeded,
          payment.failed,
          refund.created,
        ]
      example: payment.succeeded

    WebhookEndpointCreate:
      type: object
      required: [environment, url, event_types]
      additionalProperties: false
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
          description: |
            The project environment the endpoint receives events from. With
            API-key authentication it must match the key's environment.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Absolute destination URL. Only `http` and `https` are accepted, and
            the URL must satisfy the server's destination policy. Redirects are
            never followed, so the destination must answer directly.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
          default: true

    WebhookEndpointUpdate:
      type: object
      additionalProperties: false
      description: |
        At least one field is required; an empty patch is a 400. Omitted fields
        are left unchanged.
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean

    WebhookEvent:
      type: object
      required: [id, project_id, environment, type, data, created_at]
      additionalProperties: false
      description: |
        An outbound domain event instance, exactly as delivered: the stored
        envelope is the transmitted body, and replay re-delivers it unchanged
        (phase 1 §9.5). `id` is the event's UUIDv7 and is the destination's
        deduplication key.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/Environment"
        type:
          $ref: "#/components/schemas/WebhookEventType"
        data:
          type: object
          additionalProperties: true
          description: Event payload, the emitted resource snapshot.
        created_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      required:
        [
          id,
          endpoint_id,
          event_id,
          status,
          attempts,
          response_status,
          last_error,
          next_attempt_at,
          is_replay,
          created_at,
          updated_at,
        ]
      description: |
        The `(event, endpoint)` delivery aggregate (D4): one row per pair with an
        `attempts` counter and the outcome of the last attempt, not a row per
        attempt. `status` is `pending` while attempts remain (queued, in flight,
        or waiting for a scheduled retry), `delivered` after a 2xx, and `failed`
        once the attempt budget is exhausted or the outcome is non-retryable
        (D5/D6).
      properties:
        id:
          type: string
          format: uuid
          description: |
            Delivery UUIDv7, also sent as the `BrinnPay-Delivery-Id` header. It
            is the destination's key for deduplicating at-least-once retries.
        endpoint_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:
          type: integer
          minimum: 0
          description: HTTP attempts made so far; 0 before the first attempt.
        response_status:
          type: [integer, "null"]
          description: |
            HTTP status returned by the destination on the last attempt, or
            `null` when the attempt failed before a response (DNS, connect, or
            timeout).
        last_error:
          type: [string, "null"]
          maxLength: 500
          description: |
            Bounded, sanitized summary of the last failure. It never contains a
            destination response body, credentials, or a signing secret; it is
            `null` until an attempt fails.
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the next retry is scheduled (D5). `null` for a terminal delivery
            and for a `delivered` one.
        is_replay:
          type: boolean
          description: |
            `true` when the delivery was created by `webhooks.replayEvent`
            (D12). Replayed deliveries are exempt from the one-delivery-per-
            `(event, endpoint)` guarantee, so the same event can be replayed more
            than once.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RequestLog:
      type: object
      required: [id, request_id, method, path, status_code, created_at]
      description: |
        Structured record of an API request/response (Phase 11). This is an
        API-wide capability: a request may be public/unauthenticated or
        authenticated by session or API key, so project/organization/user/API key
        scope is optional. `request_id` is always present (phase 1 §7.7, §8).
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          description: Request ID assigned at ingress (phase 1 §7.7). Always present.
        project_id:
          type: [string, "null"]
          format: uuid
          description: Project scope, when the request belongs to a project.
        organization_id:
          type: [string, "null"]
          format: uuid
          description: Organization scope, when known.
        user_id:
          type: [string, "null"]
          format: uuid
          description: Authenticated user, when the request was made with a session.
        api_key_id:
          type: [string, "null"]
          format: uuid
          description: API key entity, when the request was made with API-key authentication.
        environment:
          type: [string, "null"]
          enum: [test, live, null]
          description: |
            Environment recorded with the request (Phase 11, D1). API-key
            requests always carry the key's environment; session requests carry
            the environment only when the request itself carried a validated
            one, so requests without an environment (for example a project
            retrieve) are recorded as `null`. Never mixed with another
            project's environment.
        method:
          type: string
          enum: [GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD]
        path:
          type: string
          maxLength: 2048
          description: |
            Request path **without** the query string (Phase 11, D6). Query
            strings, headers and bodies are never persisted.
        status_code:
          type: integer
        duration_ms:
          type: integer
          description: |
            Ingress to response completion, in whole milliseconds, when
            measured.
        created_at:
          type: string
          format: date-time

    AuditLogEntry:
      type: object
      required:
        [id, organization_id, actor_type, action, resource_type, created_at]
      description: |
        Immutable security/business event record (Phase 12). Entries are
        append-only: no operation updates or deletes one (phase 1 §8), and the
        database rejects `UPDATE` outright; the only deletion path is the
        cascade that removes an organization's entries with the organization
        itself. `organization_id` is always present — there is no
        platform-global or null-organization entry.
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier; also the ascending list-order key.
        organization_id:
          type: string
          format: uuid
          description: Owning organization. The entry is scoped to exactly one.
        actor_type:
          type: string
          enum: [user, api_key]
          description: |
            Who acted. Session-driven and authentication actions are `user`;
            API-key-driven actions are `api_key` (the key's identifier, never
            its plaintext). Background payment transitions are attributed to
            the payment's original creator.
        actor_id:
          type: [string, "null"]
          description: |
            Identifier of the acting user or API key, or `null` when no actor
            is representable. A plain historical value with no foreign key —
            it survives the actor's deletion and is never a secret.
        action:
          type: string
          description: |
            Machine-readable action identifier, `<resource>.<past-tense-verb>`.
            One of the closed Phase 12 catalog:

            * Authentication: `user.registered`, `user.logged_in`,
              `user.login_failed`, `user.logged_out`
            * Access control: `invitation.created`, `invitation.canceled`,
              `member.joined`, `member.role_changed`, `member.removed`
            * Payments/refunds: `payment.created`, `payment.succeeded`,
              `payment.failed`, `refund.created`
            * API keys/customers: `api_key.created`, `api_key.revoked`,
              `customer.created`, `customer.updated`, `customer.deleted`

            The property stays an open string so the catalog can grow without
            a breaking change; new values are documented here.
        resource_type:
          type: string
          description: |
            Type of the affected resource. One of `user`, `member`,
            `invitation`, `api_key`, `payment`, `refund`, `customer` —
            always paired with a catalog `action` that implies it.
        resource_id:
          type: [string, "null"]
          description: |
            Identifier of the affected resource, or `null` when none applies.
            A plain historical value with no foreign key: deleting a
            membership, key or resource leaves the reference intact.
        project_id:
          type: [string, "null"]
          format: uuid
          description: |
            Project the action belongs to (nullable, additive), present for
            project-scoped actions and `null` for organization- or
            user-scoped ones. A plain value with no foreign key.
        environment:
          type: [string, "null"]
          enum: [test, live, null]
          description: |
            Environment of the action (nullable, additive): `test`/`live` for
            project-scoped actions, `null` otherwise.
        data:
          type: object
          additionalProperties: true
          description: |
            Optional structured context, composed from a per-action allowlist
            of bounded scalars only (ids, roles, status values, monetary
            amounts as decimal strings, and the optional `request_id` of the
            triggering request for cross-reference into request logs). Omitted
            when the allowlist yields nothing. Never contains secrets,
            passwords, API-key plaintext, tokens, webhook secrets,
            `Idempotency-Key` values, emails, IP addresses, user agents,
            headers, request/response bodies or free text.
        created_at:
          type: string
          format: date-time

