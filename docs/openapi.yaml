  /projects/{project_id}/payments:
    get:
      tags: [payments]
      operationId: payments.list
      summary: List payments of a project
      description: |
        Lists the simulated payments of a project environment with cursor
        pagination. Payments advance lazily: a `pending` or `processing`
        payment whose simulated schedule has elapsed is advanced on read, so a
        page may already reflect `succeeded`/`failed` states. API-key
        authentication derives the environment from the key; an explicit
        conflicting value is a 422.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated payment list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [payments]
      operationId: payments.create
      summary: Create a payment
      description: |
        Creates a simulated payment in a project environment (created with
        `status: pending` and advanced automatically by the simulation). This
        is a critical mutation: it accepts the `Idempotency-Key` header with
        operation scope `payments.create` (ADR-0004) and **replays** it — the
        first successful call stores its `201 Payment` response for 24 hours
        per `(project, payments.create, key)`, and any later call with the same
        key returns that stored response without creating a second payment
        (concurrency-safe, Phase 8). Only committed successful responses are
        replayed, so a request that fails validation, authorization or the
        business rules leaves no stored record and the key stays reusable. A
        key reused after the 24-hour window is treated as a new operation. With
        API-key authentication the environment is derived from the key and must
        match the payload (422 otherwise). The `customer_id` must be a customer
        of the same project (and, for API keys, the same environment); unknown
        or cross-scope customers are a 404.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PaymentCreateBody"
      responses:
        "201":
          description: Payment created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/payments/{payment_id}:
    get:
      tags: [payments]
      operationId: payments.retrieve
      summary: Retrieve a payment
      description: Returns a simulated payment within its project and environment.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /payments/{payment_id}/refunds:
    get:
      tags: [refunds]
      operationId: refunds.list
      summary: List refunds of a payment
      description: |
        Lists only this payment's refunds with cursor pagination. The parent
        payment's project and environment determine access. Session users in
        any organization role may read; API keys are project/environment scoped.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated refund list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [refunds]
      operationId: refunds.create
      summary: Create a refund
      description: |
        Creates a succeeded refund synchronously against a succeeded payment,
        without changing the payment's status. Omitting `amount` refunds the
        full remaining balance after earlier refunds; an explicit positive
        amount may not exceed that balance. Exhausted or ineligible payments
        return 422. Only owner/admin sessions may create refunds; API keys are
        project/environment scoped. Optional `Idempotency-Key` uses operation
        scope `refunds.create` (ADR-0004): a successful retry within 24 hours
        replays the original 201 response without creating another refund. A
        key reused for another payment returns 409 without revealing its refund.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RefundCreateBody"
      responses:
        "201":
          description: Refund created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
