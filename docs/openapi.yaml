              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [customers]
      operationId: customers.delete
      summary: Delete a customer
      description: |
        Deletes a customer record (hard delete). 422 `BUSINESS_RULE_VIOLATION`
        when the customer has linked payments — the payments reference the
        customer (`payments.customer_id` FK is `ON DELETE RESTRICT` as the DB
        backstop).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Customer deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/payments:
    get:
      tags: [payments]
