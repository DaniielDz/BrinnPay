  /projects/{project_id}/customers:
    get:
      tags: [customers]
      operationId: customers.list
      summary: List customers of a project
      description: |
        Lists the customers of a project environment with cursor pagination and
        optional search. TEST and LIVE data is never mixed (phase 1 §8).

        With session authentication the `environment` query parameter is
        required (400 `VALIDATION_ERROR` when missing). With API-key
        authentication the environment is derived from the key and an explicit
        conflicting value is rejected (422 `BUSINESS_RULE_VIOLATION`).
        `search` matches `email` and `name` case-insensitively as a substring
        (D3).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated customer list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [customers]
      operationId: customers.create
      summary: Create a customer
      description: |
        Creates a customer record in a project environment. With API-key
        authentication the environment is derived from the key and must match
        the payload (mismatch → 422 `BUSINESS_RULE_VIOLATION`); with session
        authentication it must be provided explicitly (missing → 400
        `VALIDATION_ERROR`).

        Emails are trimmed and lowercased before storage and are **not**
        unique (D1): customers are identified by their UUIDv7 id, and multiple
        customers may share an email within a project/environment. Metadata
        (when provided) is a flat string map: string keys ≤ 40 chars, string
        values ≤ 500 chars, ≤ 50 entries; absent → `{}` (D4).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/CustomerCreateBody"
      responses:
        "201":
          description: Customer created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}/customers/{customer_id}:
    get:
      tags: [customers]
      operationId: customers.retrieve
      summary: Retrieve a customer
      description: |
        Returns a customer record within its project and environment. With
        API-key authentication the key's (project, environment) scope applies:
        a customer of a different project, or of another environment of the
        same project, is indistinguishable from a non-existent one (404,
        non-disclosure).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [customers]
      operationId: customers.update
      summary: Update a customer
      description: |
        Updates customer attributes (partial update: only provided fields
        change; a PATCH with no changed values is a no-op returning the current
        state). The environment of a customer is immutable after creation.

        `name` cannot be cleared to null in the MVP (D7): it is a non-nullable
        string in the contract; a PATCH omitting it leaves it unchanged.
        `metadata` replaces the whole map — no merging (D4).
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        $ref: "#/components/requestBodies/CustomerUpdateBody"
      responses:
        "200":
          description: Updated customer.
          headers:
