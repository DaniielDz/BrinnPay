openapi: 3.1.0

info:
  title: BrinnPay API
  version: 1.0.0
  description: |
    BrinnPay is a developer-focused payment infrastructure sandbox. It simulates
    payment infrastructure (payments, refunds, idempotency, webhooks, logs)
    without processing real money.

    This document is the canonical, single source of truth for the BrinnPay `v1`
    API surface — `docs/openapi.yaml` (phase 1 specification §13.2). It covers
    the full MVP resource surface: authentication, organizations, projects,
    API keys, customers, payments, refunds, webhooks, idempotency, and logs.

    Conventions fixed here bind every endpoint-level phase:

    - Base path and versioning: `/api/v1` (ADR-0005). No breaking changes within
      a version; the version is pinned per request by the URL. `info.version` is
      the OpenAPI document version (`1.0.0` = `v1` + document revision), not the
      product release (`v0.1.0`, roadmap Phase 26) — see `api-conventions.md`.
    - Naming: plural nouns (`/customers`, `/payments`); nested resources where
      ownership is strict (`/payments/{payment_id}/refunds`); `snake_case` path
      parameters, query parameters, and JSON fields.
    - Authentication (ADR-0006, phase 1 §7.3): API access via
      `Authorization: Bearer <api_key>` where the key is `sk_test_...` /
      `sk_live_...`. Dashboard/user endpoints authenticate via session (JWT
      access token). The two modes are **not equivalent** (API keys scope to one
      project + environment; sessions scope to the user's memberships + RBAC)
      and are documented and enforced separately per route; resource endpoints
      (customers, payments, refunds, webhooks) accept either mode.
    - Idempotency (ADR-0004): critical mutations (payment creation, refund
      creation) accept the `Idempotency-Key` header. Key scope =
      (project, operation_scope, key). Replay of the same key for the same
      operation within the 24-hour retention window returns the original stored
      response without re-executing the operation; a different operation scope
      is an independent operation; after 24 hours the key is treated as a new
      operation.
    - Pagination (phase 1 §7.5): cursor-based. List endpoints accept `limit` and
      `cursor`; responses include `next_cursor` (nullable) and `has_more`
      metadata. Cursors are opaque to clients.
    - Errors (phase 1 §7.6): consistent JSON error envelope with a stable
      machine-readable `code`, `message`, `request_id`, and optional `details`.
      HTTP status semantics: 400 validation, 401 unauthenticated, 403
      forbidden, 404 not found, 409 conflict, 422 business rule violation, 429
      rate limited, 5xx server.
    - Request IDs (phase 1 §7.7): every request is assigned a request ID at
      ingress and every response carries it in the `X-Request-Id` header.
    - Time and format conventions (phase 1 §7.8): timestamps are UTC ISO 8601
      (`YYYY-MM-DDTHH:MM:SS.sssZ`); entity IDs are UUIDv7 and must be treated as
      opaque strings; monetary amounts are decimal strings paired with a
      lowercase currency code (`usd` only in the MVP, ADR-0003).

    Sources: master specification `.ai/SPEC.md`, phase 1 specification
    (`.ai/phases/phase-01-architecture-mvp-spec.md`), ADRs 0001–0010.

servers:
  - url: /api/v1
    description: |
      Versioned API prefix (ADR-0005). Deployments replace this with the
      environment-specific base URL; the `/api/v1` prefix is preserved.

tags:
  - name: auth
    description: User registration, login, session tokens, and current user (Phase 3).
  - name: organizations
    description: Organization (tenant) management, membership, and invitations (Phase 4).
  - name: projects
    description: Project management within an organization (Phase 5).
  - name: api-keys
    description: API key management per project environment (Phase 5).
  - name: customers
    description: Developer customer records (Phase 6).
  - name: payments
    description: Simulated payment operations (Phase 7).
  - name: refunds
    description: Full and partial refunds against payments (Phase 9).
  - name: webhooks
    description: Webhook endpoints, events, and deliveries (Phase 10).
  - name: logs
    description: Request logs and audit logs (Phases 11–12).

security: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: auth.register
      summary: Register a user account
      description: |
        Creates a user account and establishes a session. In a single
        transaction (D4) the password is hashed with Argon2id (ADR-0007), a
        personal/default organization is created with the user as `owner`
        (ADR-0010), and the first refresh session is issued. The default
        organization name derives from the provided name, else the email local
        part, else `"My Organization"` (D5). Emails are normalized and unique
        case-insensitively (D8); a duplicate email returns 409. The refresh
        token is set as an `HttpOnly` cookie; it is never returned in the JSON
        body (phase 1 §11.5).
      security: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterBody"
      responses:
        "201":
          description: Account created and session established.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [auth]
      operationId: auth.login
      summary: Log in with email and password
      description: |
        Authenticates a user and issues a short-lived JWT access token. Unknown
        email and wrong password produce the identical generic 401 response, so
        the endpoint cannot be used to enumerate accounts. The refresh session
        is created and its token is set as an `HttpOnly` cookie; it is never
        returned in the JSON body (phase 1 §11.5).
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginBody"
      responses:
        "200":
          description: Authentication successful.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: auth.refresh
      summary: Refresh an access token
      description: |
        Exchanges the refresh session (sent as the `HttpOnly` cookie) for a new
        access token. A successful refresh **rotates the session** (D3): the
        presented session is revoked and a new one is issued via the cookie.
        Presenting a revoked-but-unexpired token (a replay of an already
        rotated token) is treated as a theft signal: all of the user's sessions
        are revoked and the request fails with 401. Missing, invalid, expired,
        or revoked sessions return 401 and clear the cookie.
      security: []
      responses:
        "200":
          description: New access token issued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [auth]
      operationId: auth.logout
      summary: Log out and revoke the refresh session
      description: |
        Revokes the refresh session identified by the `HttpOnly` cookie and
        clears the cookie, terminating the session. Idempotent (D9): the cookie
        is always cleared and 204 returned whether or not a valid session was
        present. Logout works with the refresh cookie alone and does not need
        an access token.
      security: []
      responses:
        "204":
          description: Session revoked and cookie cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookieCleared"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/me:
    get:
      tags: [auth]
      operationId: auth.me
      summary: Retrieve the current user
      description: Returns the profile of the authenticated session user.
      security:
        - SessionAuth: []
      responses:
        "200":
          description: Current user profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations:
    get:
      tags: [organizations]
      operationId: organizations.list
      summary: List organizations
      description: |
        Lists the organizations the authenticated user belongs to. Cursor
        pagination applies (phase 1 §7.5).
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated organization list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [organizations]
      operationId: organizations.create
      summary: Create an organization
      description: Creates a new organization with the authenticated user as owner.
      security:
        - SessionAuth: []
      requestBody:
        $ref: "#/components/requestBodies/OrganizationCreateBody"
      responses:
        "201":
          description: Organization created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}:
    get:
      tags: [organizations]
      operationId: organizations.retrieve
      summary: Retrieve an organization
      description: |
        Returns an organization. Access is limited to members of the
        organization (tenant isolation, phase 1 §6.4).
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [organizations]
      operationId: organizations.update
      summary: Update an organization
      description: |
        Updates organization attributes (`name` is the only mutable attribute).
        Requires `organizations.update` (owner/admin). Partial update: omitted
        fields are unchanged; `updated_at` advances on change.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/OrganizationUpdateBody"
      responses:
        "200":
          description: Updated organization.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [organizations]
      operationId: organizations.delete
      summary: Delete an organization
      description: |
        Deletes an organization and its tenant-scoped data (`organization_members`,
        `invitations` cascade; projects of the organization and their API keys are
        cascade-deleted, D7). **Owner only** (phase 4 §4.2). Subsequent access
        to the organization yields 404 for everyone.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Organization deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}/members:
    get:
      tags: [organizations]
      operationId: organizations.listMembers
      summary: List organization members
      description: |
        Lists the members of an organization with their roles. Access is
        limited to organization members. Cursor pagination applies.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated member list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}/members/{user_id}:
    patch:
      tags: [organizations]
      operationId: organizations.updateMember
      summary: Update a member role
      description: |
        Changes the role of an organization member (phase 4 §4.2, D4).
        Own rights: an owner may change any member's role; an admin may change
        roles of admin/member/viewer but not owner members; granting `owner`
        requires an owner actor. A member may change their own role only
        downward (self-demotion). The last `owner` role cannot be changed
        (422). `updated_at` advances on change.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        $ref: "#/components/requestBodies/OrganizationMemberUpdateBody"
      responses:
        "200":
          description: Updated member.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [organizations]
      operationId: organizations.removeMember
      summary: Remove an organization member
      description: |
        Removes a member from the organization (phase 4 §4.2, D4). An owner may
        remove any member; an admin may remove admin/member/viewer but not owner
        members; **self-removal is always permitted**. Removing the last `owner`
        is rejected (422).
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}/invitations:
    get:
      tags: [organizations]
      operationId: organizations.listInvitations
      summary: List organization invitations
      description: |
        Lists pending and historical invitations (all statuses) of an
        organization. Requires `invitations.read` (owner/admin). Cursor
        pagination applies.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated invitation list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [organizations]
      operationId: organizations.createInvitation
      summary: Invite a user to an organization
      description: |
        Creates a pending membership invitation (phase 4 §4.2, D5). Requires
        `invitations.create` (owner/admin). `email` is normalized (trimmed +
        lowercased). Inviting an existing member or creating a duplicate pending
        invitation for the same email yields 409; inviting an `owner` role
        requires an owner actor. Invitations have no expiry and no decline.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/InvitationCreateBody"
      responses:
        "201":
          description: Invitation created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /organizations/{organization_id}/invitations/{invitation_id}:
    delete:
      tags: [organizations]
      operationId: organizations.cancelInvitation
      summary: Cancel an organization invitation
      description: |
        Revokes a pending invitation (phase 4 §4.2, D5). Requires
        `invitations.cancel` (owner/admin). Idempotent: canceling an
        already-canceled invitation is a no-op (204). Canceling an `accepted`
        invitation is rejected (422).
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation canceled.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /invitations/{invitation_id}/accept:
    post:
      tags: [organizations]
      operationId: organizations.acceptInvitation
      summary: Accept an organization invitation
      description: |
        Accepts a pending invitation for the authenticated user and creates their
        membership with the invited role (phase 4 §4.2, D5/D6). The invitation is
        bound to the account email: a non-matching email receives the same 404 as
        an unknown id (no disclosure). A non-pending invitation yields 422; an
        already-member yields 409.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "201":
          description: Invitation accepted and membership created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects:
    get:
      tags: [projects]
      operationId: projects.list
      summary: List projects
      description: |
        Lists projects of the organizations the authenticated user belongs to.
        Cursor pagination applies.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated project list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [projects]
      operationId: projects.create
      summary: Create a project
      description: |
        Creates a project inside an organization. Projects support the TEST and
        LIVE simulated environments (phase 1 §5.2).
      security:
        - SessionAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ProjectCreateBody"
      responses:
        "201":
          description: Project created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /projects/{project_id}:
    get:
      tags: [projects]
      operationId: projects.retrieve
      summary: Retrieve a project
      description: |
        Returns a project. Access requires membership in the owning organization
        and project access within it (phase 1 §11.4); non-members receive 404 so
        project existence is not disclosed.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [projects]
      operationId: projects.update
      summary: Update a project
      description: |
        Updates project attributes. Requires an administrative role in the
        owning organization.
      security:
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/ProjectUpdateBody"
      responses:
        "200":
          description: Updated project.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [projects]
      operationId: projects.delete
      summary: Delete a project
      description: |
        Deletes a project and its tenant-scoped data, including the project's API
