        the key and must match the payload (422 otherwise). The `customer_id`
        must be a customer of the same project (and, for API keys, the same
        environment); unknown or cross-scope customers are a 404.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PaymentCreateBody"
      responses:
        "201":
          description: Payment created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
