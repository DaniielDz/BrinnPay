packages:
  - "apps/*"
  - "packages/*"

# Build-script approval (pnpm 12 blocks unapproved build scripts by default):
# - Prisma engines are required by @prisma/client at runtime;
# - esbuild needs its platform binary wiring;
# - argon2 compiles/prebuilds its native binding;
# - @scarf/scarf (telemetry) is explicitly ignored.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  argon2: true
  "@scarf/scarf": false
  # msgpackr-extract is BullMQ's optional native msgpack accelerator; BullMQ
  # falls back to the pure-JS implementation, so no build is required.
  msgpackr-extract: false
